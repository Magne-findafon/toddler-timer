<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toddler Timer</title>
<meta name="description" content="A calm visual timer for small children. Less color = less time. Free, no ads, no account.">
<meta name="theme-color" content="#111111">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Crect x='22' y='16' width='32' height='32' rx='6' fill='%237A9A7E'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #111111;
    --sage: #7A9A7E;
    --sage-soft: rgba(122, 154, 126, 0.07);
    --glow: rgba(176, 204, 178, 0.85);
    --text: #a3aaa4;
    --text-dim: #6c726d;
    --line: rgba(163, 170, 164, 0.22);
    --radius: 26px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- Start screen ---------- */
  #start {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2rem;
    padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
    text-align: center;
  }
  .intro h1 {
    margin: 0 0 .4rem;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: .02em;
    color: var(--text);
  }
  .intro p { margin: 0; font-size: .9rem; color: var(--text-dim); }
  .swatch {
    width: 44px; height: 14px; border-radius: 4px;
    background: var(--sage);
    margin: 0 auto 1.1rem;
  }
  .presets {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: .75rem;
    width: min(100%, 320px);
  }
  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    border-radius: 16px;
    padding: 1.1rem .5rem;
    font-size: 1.15rem;
    cursor: pointer;
    transition: background .2s, border-color .2s;
    touch-action: manipulation;
  }
  .btn small { font-size: .8rem; color: var(--text-dim); margin-left: .2rem; }
  .btn:hover { background: rgba(255,255,255,.03); }
  .btn:active { background: rgba(122,154,126,.12); border-color: rgba(122,154,126,.5); }
  .btn:focus-visible, input:focus-visible, .toggle:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
  .custom {
    display: flex;
    gap: .6rem;
    width: min(100%, 320px);
  }
  .custom label {
    flex: 1;
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 0 .8rem;
    gap: .3rem;
    min-width: 0;
  }
  .custom input {
    width: 100%;
    min-width: 0;
    background: transparent;
    border: 0;
    padding: .9rem 0;
    font-size: 1.05rem;
    outline: none;
  }
  .custom input::placeholder { color: var(--text-dim); }
  .custom span { color: var(--text-dim); font-size: .85rem; }
  .custom .btn { padding: .9rem 1.3rem; font-size: 1rem; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: .7rem;
    background: none;
    border: 0;
    padding: .4rem;
    cursor: pointer;
    color: var(--text-dim);
    font-size: .9rem;
  }
  .toggle .track {
    width: 38px; height: 22px; border-radius: 11px;
    background: rgba(255,255,255,.08);
    position: relative;
    transition: background .2s;
  }
  .toggle .track::after {
    content: "";
    position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--text-dim);
    transition: transform .2s, background .2s;
  }
  .toggle[aria-checked="true"] { color: var(--text); }
  .toggle[aria-checked="true"] .track { background: rgba(122,154,126,.45); }
  .toggle[aria-checked="true"] .track::after { transform: translateX(16px); background: #d7ddd7; }
  .settings { display: flex; flex-direction: column; align-items: flex-start; gap: .35rem; }
  footer { font-size: .75rem; color: #4d524e; max-width: 320px; line-height: 1.5; }

  /* ---------- Running screen ---------- */
  #run {
    position: fixed;
    inset: 0;
    background: var(--bg);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    cursor: default;
  }
  #bar {
    position: absolute;
    top: max(6vh, env(safe-area-inset-top));
    bottom: max(6vh, env(safe-area-inset-bottom));
    left: max(6vw, env(safe-area-inset-left));
    right: max(6vw, env(safe-area-inset-right));
    border-radius: var(--radius);
    background: var(--sage-soft);
  }
  #fill {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    background: var(--sage);
    clip-path: inset(0 0 0 0 round var(--radius));
    will-change: clip-path;
  }
  #edge {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 4px;
    margin-left: -2px;
    border-radius: 2px;
    background: var(--glow);
    box-shadow: 0 0 22px 8px rgba(160, 192, 163, .45);
    opacity: .35;
    animation: breathe 2.6s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes breathe {
    from { opacity: .15; }
    to   { opacity: .8; }
  }
  /* Portrait: color is removed from the top, the edge travels downwards. */
  #run.vertical #edge {
    top: 0; left: 0; right: 0; bottom: auto;
    width: auto; height: 4px;
    margin-left: 0; margin-top: -2px;
  }
  #run.paused #edge { animation-play-state: paused; opacity: .2; }
  #run.done #edge, #run.done #fill { display: none; }

  /* Gentle ending: the empty bar softly breathes a few times, then rests. */
  #endglow {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    background: var(--sage);
    opacity: 0;
    pointer-events: none;
  }
  #run.done #endglow { animation: endbreathe 4.5s ease-in-out 3; }
  @keyframes endbreathe {
    0%, 100% { opacity: 0; }
    50% { opacity: .16; }
  }
  #run.done #bar { transition: background 3s; background: rgba(122,154,126,.04); }

  /* Overlay controls */
  #controls {
    position: absolute;
    left: 50%;
    bottom: max(1.2rem, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    gap: .6rem;
    padding: .5rem;
    border-radius: 999px;
    background: rgba(17,17,17,.72);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .6s ease;
  }
  #run.show-controls #controls { opacity: 1; pointer-events: auto; }
  .ctl {
    position: relative;
    overflow: hidden;
    appearance: none;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    color: rgba(255,255,255,.55);
    border-radius: 999px;
    padding: .7rem 1.2rem;
    font-size: .9rem;
    cursor: pointer;
    white-space: nowrap;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .ctl span { position: relative; }
  #stop::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(122,154,126,.35);
    transform-origin: left;
    transform: scaleX(0);
  }
  #stop.holding::before { transform: scaleX(1); transition: transform 1.5s linear; }

  /* Subtle remaining time for the grown-up, in the margin under the bar. */
  #clock {
    position: absolute;
    right: max(6vw, env(safe-area-inset-right));
    bottom: 0;
    height: max(6vh, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    padding-right: 4px;
    font-size: 13px;
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, .26);
    opacity: 0;
    transition: opacity .6s ease;
    pointer-events: none;
  }
  #run.with-clock #clock, #run.show-controls #clock { opacity: 1; }
  #run.done #clock { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    #edge { animation: none; opacity: .45; }
    #run.done #endglow { animation: none; }
    #controls, .btn, .toggle .track, .toggle .track::after { transition: none; }
  }
</style>
</head>
<body>

<main id="start">
  <div class="intro">
    <div class="swatch" aria-hidden="true"></div>
    <h1>Toddler Timer</h1>
    <p>Less color, less time.</p>
  </div>

  <div class="presets" role="group" aria-label="Start a timer">
    <button class="btn" data-min="5">5<small>min</small></button>
    <button class="btn" data-min="10">10<small>min</small></button>
    <button class="btn" data-min="15">15<small>min</small></button>
    <button class="btn" data-min="30">30<small>min</small></button>
  </div>

  <form class="custom" id="customForm" autocomplete="off">
    <label>
      <input id="customMin" type="number" inputmode="numeric" min="0" max="240" step="1" placeholder="0" aria-label="Custom minutes">
      <span>min</span>
    </label>
    <label>
      <input id="customSec" type="number" inputmode="numeric" min="0" max="59" step="1" placeholder="0" aria-label="Custom seconds">
      <span>sec</span>
    </label>
    <button class="btn" type="submit">Start</button>
  </form>

  <div class="settings">
  <button class="toggle" id="soundToggle" role="switch" aria-checked="false">
    <span class="track" aria-hidden="true"></span>
    <span>Soft chime at the end</span>
  </button>
  <button class="toggle" id="clockToggle" role="switch" aria-checked="true">
    <span class="track" aria-hidden="true"></span>
    <span>Show time left (small, for you)</span>
  </button>
  </div>

  <footer>
    Tap the screen while it runs to pause. Hold “Stop” to end early.<br>
    Free · no ads · no account · nothing leaves your device.
  </footer>
</main>

<section id="run" hidden aria-label="Timer running">
  <div id="bar">
    <div id="fill"></div>
    <div id="edge"></div>
    <div id="endglow"></div>
  </div>
  <div id="clock" aria-live="off"></div>
  <div id="controls">
    <button class="ctl" id="pause"><span>Pause</span></button>
    <button class="ctl" id="stop"><span>Hold to stop</span></button>
  </div>
</section>

<script>
(() => {
  'use strict';

  // ---------- Elements ----------
  const $ = (id) => document.getElementById(id);
  const startEl = $('start'), runEl = $('run'), fillEl = $('fill'), edgeEl = $('edge');
  const pauseBtn = $('pause'), stopBtn = $('stop'), soundToggle = $('soundToggle');

  // ---------- Storage (never required to work) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  // ---------- State ----------
  // status: 'idle' | 'running' | 'paused' | 'done'
  const state = { status: 'idle', duration: 0, endTime: 0, remaining: 0 };
  let rafId = 0, endTimeout = 0, hideTimeout = 0, holdTimeout = 0;

  function saveState() {
    if (state.status === 'running' || state.status === 'paused') {
      store.set('tt-state', JSON.stringify(state));
    } else {
      store.del('tt-state');
    }
  }

  // ---------- Sound (muted by default) ----------
  let soundOn = store.get('tt-sound') === 'on';
  let audioCtx = null;

  function renderSoundToggle() { soundToggle.setAttribute('aria-checked', String(soundOn)); }
  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    store.set('tt-sound', soundOn ? 'on' : 'off');
    renderSoundToggle();
    if (soundOn) unlockAudio();
  });
  renderSoundToggle();

  // ---------- Subtle clock (on by default) ----------
  const clockEl = $('clock'), clockToggle = $('clockToggle');
  let clockOn = store.get('tt-clock') !== 'off';
  let lastClockText = '';
  function renderClockToggle() {
    clockToggle.setAttribute('aria-checked', String(clockOn));
    runEl.classList.toggle('with-clock', clockOn);
  }
  clockToggle.addEventListener('click', () => {
    clockOn = !clockOn;
    store.set('tt-clock', clockOn ? 'on' : 'off');
    renderClockToggle();
  });
  renderClockToggle();

  function formatTime(ms) {
    const total = Math.ceil(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const ss = String(s).padStart(2, '0');
    return h > 0 ? h + ':' + String(m).padStart(2, '0') + ':' + ss : m + ':' + ss;
  }
  function drawClock(ms) {
    const t = formatTime(Math.max(0, ms));
    if (t !== lastClockText) { clockEl.textContent = t; lastClockText = t; }
  }

  // Must be called from a user gesture (iOS).
  function unlockAudio() {
    if (!soundOn) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      // Play one silent sample to fully unlock on older iOS.
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
    } catch (e) {}
  }

  // A soft, short two-note bell made from sine waves.
  function chime() {
    if (!soundOn || !audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime + 0.05;
      const master = audioCtx.createGain();
      master.gain.value = 0.22;
      master.connect(audioCtx.destination);
      const note = (freq, t) => {
        [[1, 1], [2.01, 0.18], [3.0, 0.05]].forEach(([mult, amp]) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq * mult;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(amp, t + 0.03);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
          osc.connect(g); g.connect(master);
          osc.start(t); osc.stop(t + 2.7);
        });
      };
      note(659.25, now);        // E5
      note(493.88, now + 0.55); // B4
    } catch (e) {}
  }

  // ---------- Wake lock (fail silently) ----------
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { wakeLock = null; }
  }
  function releaseWakeLock() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  // ---------- Drawing ----------
  // Portrait (taller than wide): top -> bottom. Landscape: left -> right.
  const portraitQuery = window.matchMedia('(orientation: portrait)');
  let vertical = portraitQuery.matches;
  function applyOrientation() {
    vertical = portraitQuery.matches;
    runEl.classList.toggle('vertical', vertical);
    edgeEl.style.left = edgeEl.style.top = '';
  }
  applyOrientation();

  function draw(fraction) {
    const f = Math.max(0, Math.min(1, fraction));
    const cut = ((1 - f) * 100).toFixed(3) + '%';
    fillEl.style.clipPath = vertical
      ? 'inset(' + cut + ' 0 0 0 round 26px)'
      : 'inset(0 0 0 ' + cut + ' round 26px)';
    fillEl.style.webkitClipPath = fillEl.style.clipPath;
    if (vertical) edgeEl.style.top = cut; else edgeEl.style.left = cut;
    edgeEl.style.visibility = f > 0 ? 'visible' : 'hidden';
    if (state.duration) drawClock(f * state.duration);
  }

  function remainingMs() {
    if (state.status === 'paused') return state.remaining;
    return Math.max(0, state.endTime - Date.now());
  }

  function tick() {
    rafId = 0;
    if (state.status !== 'running') return;
    const rem = remainingMs();
    draw(rem / state.duration);
    if (rem <= 0) { finish(); return; }
    rafId = requestAnimationFrame(tick);
  }

  function startLoop() {
    if (!rafId) rafId = requestAnimationFrame(tick);
    clearTimeout(endTimeout);
    // Backup trigger so the end (and chime) still fires if frames are throttled.
    endTimeout = setTimeout(() => { if (state.status === 'running') tick(); },
      Math.max(0, state.endTime - Date.now()) + 30);
  }
  function stopLoop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    clearTimeout(endTimeout);
  }

  // ---------- Screens ----------
  function showRun() {
    startEl.hidden = true;
    runEl.hidden = false;
    runEl.classList.remove('done', 'paused', 'show-controls');
  }
  function showStart() {
    runEl.hidden = true;
    startEl.hidden = false;
    runEl.classList.remove('done', 'paused', 'show-controls');
  }

  // ---------- Actions ----------
  function start(seconds) {
    const sec = Number(seconds);
    if (!isFinite(sec) || sec <= 0) return;
    unlockAudio(); // inside the tap gesture
    state.duration = Math.round(Math.min(sec, 240 * 60) * 1000);
    state.endTime = Date.now() + state.duration;
    state.remaining = state.duration;
    state.status = 'running';
    saveState();
    showRun();
    pauseBtn.firstElementChild.textContent = 'Pause';
    draw(1);
    requestWakeLock();
    startLoop();
  }

  function pause() {
    if (state.status !== 'running') return;
    state.remaining = remainingMs();
    state.status = 'paused';
    stopLoop();
    runEl.classList.add('paused');
    pauseBtn.firstElementChild.textContent = 'Resume';
    saveState();
  }

  function resume() {
    if (state.status !== 'paused') return;
    unlockAudio();
    state.endTime = Date.now() + state.remaining;
    state.status = 'running';
    runEl.classList.remove('paused');
    pauseBtn.firstElementChild.textContent = 'Pause';
    saveState();
    requestWakeLock();
    startLoop();
  }

  function finish() {
    if (state.status !== 'running') return;
    const late = Date.now() - state.endTime;
    state.status = 'done';
    stopLoop();
    draw(0);
    saveState();
    runEl.classList.add('done');
    runEl.classList.remove('show-controls');
    pauseBtn.hidden = true;
    stopBtn.firstElementChild.textContent = 'Done';
    // Only chime if we noticed the end on time (not minutes later after unlocking).
    if (late < 10000) chime();
    // Keep the screen on a little longer so the gentle ending is seen.
    setTimeout(() => { if (state.status === 'done') releaseWakeLock(); }, 20000);
  }

  function cancel() {
    stopLoop();
    releaseWakeLock();
    state.status = 'idle';
    saveState();
    pauseBtn.hidden = false;
    stopBtn.firstElementChild.textContent = 'Hold to stop';
    showStart();
  }

  // ---------- Start screen events ----------
  document.querySelectorAll('.presets .btn').forEach((b) => {
    b.addEventListener('click', () => start(Number(b.dataset.min) * 60));
  });
  const minInput = $('customMin'), secInput = $('customSec');
  try {
    const last = JSON.parse(store.get('tt-custom2') || 'null');
    if (last) { if (last.m) minInput.value = last.m; if (last.s) secInput.value = last.s; }
  } catch (e) {}
  $('customForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const m = Math.max(0, Math.floor(Number(minInput.value) || 0));
    const s = Math.max(0, Math.floor(Number(secInput.value) || 0));
    const total = m * 60 + s;
    if (!(total > 0)) { minInput.focus(); return; }
    store.set('tt-custom2', JSON.stringify({ m, s }));
    minInput.blur(); secInput.blur();
    start(total);
  });

  // ---------- Running screen: hidden controls ----------
  function showControls() {
    runEl.classList.add('show-controls');
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      if (!stopBtn.classList.contains('holding')) runEl.classList.remove('show-controls');
      else showControls();
    }, 3000);
  }
  runEl.addEventListener('click', (e) => {
    if (e.target.closest('#controls')) return;
    showControls();
  });
  runEl.addEventListener('contextmenu', (e) => e.preventDefault());

  pauseBtn.addEventListener('click', () => {
    if (state.status === 'running') pause();
    else if (state.status === 'paused') resume();
    showControls();
  });

  // Stop: long-press (~1.5 s) while running; a simple tap once finished.
  function holdStart(e) {
    e.preventDefault();
    if (state.status === 'done') { cancel(); return; }
    stopBtn.classList.add('holding');
    showControls();
    clearTimeout(holdTimeout);
    holdTimeout = setTimeout(() => {
      stopBtn.classList.remove('holding');
      cancel();
    }, 1500);
  }
  function holdEnd() {
    clearTimeout(holdTimeout);
    stopBtn.classList.remove('holding');
  }
  stopBtn.addEventListener('pointerdown', holdStart);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((t) => stopBtn.addEventListener(t, holdEnd));
  // Keyboard: hold Enter/Space on the stop button.
  stopBtn.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) holdStart(e);
  });
  stopBtn.addEventListener('keyup', holdEnd);
  stopBtn.addEventListener('click', (e) => e.preventDefault());

  // ---------- Tabs, locking, rotation ----------
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (state.status === 'running' || state.status === 'paused') requestWakeLock();
    if (state.status === 'running') {
      if (remainingMs() <= 0) finish(); else startLoop();
    }
  });
  // Redraw immediately on rotation/resize (the bar uses % so it adapts itself).
  function onLayoutChange() {
    applyOrientation();
    if (state.status === 'running' || state.status === 'paused') draw(remainingMs() / state.duration);
  }
  window.addEventListener('resize', onLayoutChange);
  if (portraitQuery.addEventListener) portraitQuery.addEventListener('change', onLayoutChange);

  // ---------- Restore a timer if the browser reloaded the page ----------
  try {
    const saved = JSON.parse(store.get('tt-state') || 'null');
    if (saved && saved.duration > 0) {
      Object.assign(state, saved);
      if (state.status === 'running' && state.endTime > Date.now()) {
        showRun(); requestWakeLock(); startLoop();
      } else if (state.status === 'paused') {
        showRun(); runEl.classList.add('paused');
        pauseBtn.firstElementChild.textContent = 'Resume';
        draw(state.remaining / state.duration);
      } else {
        state.status = 'idle'; saveState();
      }
    }
  } catch (e) { store.del('tt-state'); }
})();
</script>
</body>
</html>
